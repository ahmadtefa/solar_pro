name: kayan_erp
description: Kayan ERP - universal multi-tenant ERP client (Flutter, Web and desktop).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management and routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # HTTP + persistence
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  # Formatting and charts
  intl: any
  fl_chart: ^0.68.0
  url_launcher: ^6.2.6
  file_picker: ^8.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
