[project]
name = "kayan-erp-backend"
version = "1.0.0"
description = "Kayan ERP - universal multi-tenant ERP backend (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "S"]
ignore = [
    "S101",   # asserts are used deliberately in services
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "E501",   # long lines are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
filterwarnings = [
    "ignore::DeprecationWarning",
]
