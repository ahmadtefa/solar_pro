name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  FLUTTER_CHANNEL: stable

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests run against SQLite; the API and services are exercised for real.
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      STORAGE_DIR: ./storage-ci
      BACKUP_DIR: ./backups-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Tests (pytest)
        run: pytest -q

      - name: Migration smoke test
        run: |
          rm -f /tmp/ci_migration.db
          DATABASE_URL=sqlite:////tmp/ci_migration.db alembic upgrade head
          DATABASE_URL=sqlite:////tmp/ci_migration.db alembic current

      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            backend/*.db
            backend/storage-ci/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Flutter analyze, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --reporter expanded

      - name: Build web bundle
        run: flutter build web --release --dart-define=API_BASE_URL=/api/v1

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: kayan-web
          path: frontend/build/web
          retention-days: 14

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: kayan-erp/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/web.Dockerfile
          push: false
          tags: kayan-erp/web:ci
          build-args: |
            API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose file
        run: |
          cp infrastructure/.env.example .env
          docker compose -f infrastructure/docker-compose.yml config --quiet
          rm -f .env
